---
name: ci

on:
  pull_request:
    branches:
      - master
      - main
      - develop
    types:
      - opened
      - synchronize
      - reopened
      - closed
  push:
    branches:
      - master
      - main
      - develop
env:
  debug_ci: true
jobs:
  setup_outputs:
    runs-on: ubuntu-latest
    outputs:
      vsix_name: ${{ steps.get_vsix_name.outputs.vsix_name || steps.get_vsix_name_prerelease.outputs.vsix_name }}
      version: ${{ steps.get_version.outputs.version }}
      vsix_path: ${{ steps.get_vsix_path.outputs.vsix_path }}
      sha: ${{ steps.master_branch.outputs.sha }}
      abbrev_sha: ${{ steps.get_abbrev_sha.outputs.sha }}
      github_sha: ${{ steps.github_ref.outputs.sha }}
      github_abbrev_sha: ${{ steps.get_abbrev_github_ref.outputs.sha }}
      dispatch_ref: ${{ github.event.pull_request.head.ref || false }}
      extension_name: ${{ steps.get_extension_name.outputs.extension_name }}
      authorized: ${{ steps.check_user_permissions.outputs.require-result }}
      is_merged: ${{ steps.check_pr_merged.outputs.is_merged || false }}
      is_prerelease: ${{ steps.check_prerelease.is_prerelease || false }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Get version
        id: get_version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Extract master SHA
        id: master_branch
        run: echo "sha=$(git rev-parse master)" >> "$GITHUB_OUTPUT"
      - name: Get abbreviated sha (12 chars)
        id: get_abbrev_sha
        run: echo "sha=$(echo -n '${{ steps.master_branch.outputs.sha }}' | cut -c 1-11 )" >> "$GITHUB_OUTPUT"
      - name: Extract PR GitHub Ref SHA
        id: github_ref
        run: |
          git fetch origin ${GITHUB_REF}:${GITHUB_REF} --
          echo "sha=$(git rev-parse $GITHUB_REF)" >> "$GITHUB_OUTPUT"
      - name: Get abbreviated GitHub Ref sha (12 chars)
        id: get_abbrev_github_ref
        run: echo "sha=$(echo -n '${{ steps.github_ref.outputs.sha }}' | cut -c 1-11 )" >> "$GITHUB_OUTPUT"
      - name: Check if PR merged & github.ref is master
        id: check_pr_merged
        run: echo "is_merged=$(echo -n '${{ github.event.pull_request.merged == true && github.ref == 'refs/heads/master' }}')" >> "$GITHUB_OUTPUT"
      - name: Check if PR merged & github.ref is develop
        id: check_prerelease
        run: echo "is_prerelease=$(echo -n '${{ github.event.pull_request.merged == true && github.ref == 'refs/heads/develop' }}')" >> "$GITHUB_OUTPUT"
      - name: Get VSCode Extension name
        id: get_extension_name
        run: echo "extension_name=$(echo "${{ github.repository_owner }}" | tr 'A-Z' 'a-z').$(echo "${{ github.event.repository.name }}" | sed -e 's/^vscode-//g')" >> "$GITHUB_OUTPUT"
      - if: ${{ steps.check_pr_merged.outputs.is_merged == true && steps.check_prerelease.outputs.is_prerelease == false }}
        name: Get .vsix artifact name (master branch release)
        id: get_vsix_name
        run: echo "vsix_name=${{ steps.get_extension_name.outputs.extension_name }}-${{ steps.get_version.outputs.version }}.${{ steps.get_abbrev_github_ref.outputs.sha }}" >> "$GITHUB_OUTPUT"
      - if: >-
          ( steps.check_pr_merged.outputs.is_merged == true && steps.check_prerelease.outputs.is_prerelease == true ) ||
          steps.check_pr_merged.outputs.is_merged == false
        name: Get .vsix artifact name (pre-release)
        id: get_vsix_name_prerelease
        run: echo "vsix_name=${{ steps.get_extension_name.outputs.extension_name }}-${{ steps.get_version.outputs.version }}.${{ steps.get_abbrev_sha.outputs.sha }}" >> "$GITHUB_OUTPUT"
      - name: Get .vsix path
        id: get_vsix_path
        run: echo "vsix_path=${{ steps.get_vsix_name.outputs.vsix_name || steps.get_vsix_name_prerelease.outputs.vsix_name }}.vsix" >> "$GITHUB_OUTPUT"
      - name: Check triggering user permissions
        id: check_user_permissions
        uses: actions-cool/check-user-permission@v2.3.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          username: ${{ github.triggering_actor }}
          require: write
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-13, macos-14, macos-15, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install pnpm
        run: npm install -g pnpm
      - name: Install dependencies
        run: pnpm install
      - name: Install Xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb
        if: ${{ runner.os == 'Linux' }}
      - name: Compile & Lint
        run: pnpm run pretest
      - name: Launch Xvfb
        run: |
          export DISPLAY=:99.0
          Xvfb :99 -screen 0 1024x768x24 > /dev/null 2>&1 &
        if: ${{ runner.os == 'Linux' }}
      - name: Run tests
        run: pnpm run test
        env:
          DISPLAY: ${{ runner.os == 'Linux' && ':99.0' || '' }}
          DEBUG_CI: ${{ env.debug_ci == 'true' || runner.debug == '1' }}
  debug:
    runs-on: ubuntu-latest
    needs:
      - setup_outputs
      - test
    steps:
      - name: Debug auth
        run: |
          echo "Authorized: ${{ needs.setup_outputs.outputs.authorized }}"
      - name: Debug vsix name
        run: |
          echo "VSIX Name: ${{ needs.setup_outputs.outputs.vsix_name }}"
      - name: Debug version
        run: |
          echo "Version: ${{ needs.setup_outputs.outputs.version }}"
      - name: Debug vsix path
        run: |
          echo "VSIX Path: ${{ needs.setup_outputs.outputs.vsix_path }}"
      - name: Debug SHA
        run: |
          echo "SHA: ${{ needs.setup_outputs.outputs.sha }}"
      - name: Debug abbreviated SHA
        run: |
          echo "Abbreviated SHA: ${{ needs.setup_outputs.outputs.abbrev_sha }}"
      - name: Debug extension name
        run: |
          echo "Extension Name: ${{ needs.setup_outputs.outputs.extension_name }}"
      - name: Debug GitHub Ref SHA
        run: |
          echo "SHA: ${{ needs.setup_outputs.outputs.github_sha }}"
      - name: Debug abbreviated GitHub Ref SHA
        run: |
          echo "Abbreviated GitHub Ref SHA: ${{ needs.setup_outputs.outputs.github_abbrev_sha }}"
      - name: Debug is PR merged?
        run: |
          echo "Is PR Merged?: ${{ needs.setup_outputs.outputs.is_merged }}"
      - name: Debug is pre-release?
        run: |
          echo "Is pre-release?: ${{ needs.setup_outputs.outputs.is_prerelease }}"
      - name: Debug build conditions
        run: |
          echo "Authorized?: ${{ format('{0}', needs.setup_outputs.outputs.authorized) == 'true' }}"
          echo "Pull Request Merged?: ${{ github.event.pull_request.merged == true }}"
          echo "PR Labels contains 'release'?: ${{ contains(github.event.pull_request.labels.*.name, 'release') }}"
          echo "Label event is 'release'?: ${{ github.event.label.name == 'release' }}"
          echo "Test result is 'success'?: ${{ needs.test.result == 'success' }}"
  build:
    runs-on: ubuntu-latest
    needs:
      - setup_outputs
      - test
    if: >-
      format('{0}', needs.setup_outputs.outputs.authorized) == 'true' &&
      (
        contains(github.event.pull_request.labels.*.name, 'release') ||
          (
            github.event.label.name == 'release' &&
            github.event.pull_request.merged == true
          )
      ) &&
      needs.test.result == 'success'
    steps:
      # Always checkout master sha unless pre-release or unmerged
      - if: ${{ needs.setup_outputs.outputs.is_merged == true && needs.setup_outputs.outputs.is_prerelease == false }}
        uses: actions/checkout@v2
        with:
          ref: ${{ needs.setup_outputs.outputs.sha }}
      - if: >-
          ( needs.setup_outputs.outputs.is_merged == true && needs.setup_outputs.outputs.is_prerelease == true ) ||
          needs.setup_outputs.outputs.is_merged == false
        uses: actions/checkout@v2
        with:
          ref: ${{ needs.setup_outputs.outputs.github_sha }}
      - uses: actions/setup-node@v4
      - name: Install dependencies
        run: npm ci
      - name: Run typescript Transpile
        run: npm run vscode:prepublish
      - if: needs.setup_outputs.outputs.is_prerelease == true
        name: Package extension (pre-release)
        run: npx vsce package --pre-release --out ${{ needs.setup_outputs.outputs.vsix_path }}
      - if: needs.setup_outputs.outputs.is_prerelease == false
        name: Package extension
        run: npx vsce package --out ${{ needs.setup_outputs.outputs.vsix_path }}
      - name: Upload VSIX artifact
        if: ${{ success() && format('{0}', needs.setup_outputs.outputs.authorized) == 'true' && github.event.pull_request.merged == true }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.setup_outputs.outputs.vsix_name }}-${{ github.run_number }}-${{ github.run_attempt }}
          path: "${{ needs.setup_outputs.outputs.vsix_path }}"
          if-no-files-found: 'error'
      - name: Check for vsce
        run: which vsce || echo "vsce not found"
        if: ${{ env.debug_ci == 'true' && runner.os != 'Windows' }}
      - name: List files
        run: ls -lA
        if: ${{ env.debug_ci == 'true' && runner.os != 'Windows' }}
      - name: Install eza (Linux deb)
        run: sudo apt-get install -y eza
        if: ${{ env.debug_ci == 'true' && runner.os == 'Linux' }}
      - name: Install eza (macOS brew)
        run: brew install eza
        if: ${{ env.debug_ci == 'true' && runner.os == 'macOS' }}
      - name: List files in pretty print tree view
        run: eza --icons --color-scale --classify --git -la --header --tree --ignore-glob='.git'  --git-ignore --binary
        if: ${{ env.debug_ci == 'true' && runner.os != 'Windows' }}
      - name: Trigger publish workflow
        if: ${{ success() && format('{0}', needs.setup_outputs.outputs.authorized) == 'true' && github.event.pull_request.merged == true }}
        uses: actions/github-script@v7
        env:
          VSIX_ARTIFACT: "${{ needs.setup_outputs.outputs.vsix_name }}-${{ github.run_number }}-${{ github.run_attempt }}"
          DISPATCH_REF: "${{ needs.setup_outputs.outputs.dispatch_ref }}"
          PRE_RELEASE: "${{ needs.setup_outputs.outputs.is_prerelease }}"
        with:
          script: |
            const vsixArtifact = process.env.VSIX_ARTIFACT;
            const dispatchRef = process.env.DISPATCH_REF || 'master';
            const preRelease = process.env.PRE_RELEASE || 'true';
            const runId = process.env.GITHUB_RUN_ID;
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'publish.yml',
              ref: dispatchRef,
              inputs: {
                vsix_artifact: vsixArtifact,
                workflow_run_id: runId,
                pre_release: preRelease,
                publish_ms: true,
                publish_ovsx: true
              }
            })
          result-encoding: string
          github-token: ${{ secrets.VSCODE_ACPIHELPER_PUBLISH }}
